asyncapi: 2.6.0
info:
  title: Smart House Events API
  version: 1.0.0
  description: Асинхронные события системы умного дома

servers:
  production:
    url: kafka://kafka.smarthouse.com:9092
    protocol: kafka

channels:
  telemetry:
    publish:
      operationId: publishTelemetry
      message:
        $ref: '#/components/messages/TelemetryEvent'

    subscribe:
      operationId: subscribeToTelemetry
      message:
        $ref: '#/components/messages/TelemetryEvent'

components:
  messages:
    TelemetryEvent:
      name: TelemetryEvent
      title: Событие телеметрии
      summary: Обновление данных телеметрии
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TelemetryEventPayload'

  schemas:
    TelemetryEventPayload:
      type: object
      required:
        - device_id
        - timestamp
        - metrics
      properties:
        device_id:
          type: string
        timestamp:
          type: string
          format: date-time
        metrics:
          type: object
          additionalProperties:
            type: number
        anomaly_score:
          type: number
          minimum: 0
          maximum: 1
