asyncapi: 2.6.0
info:
  title: Smart House Events API
  version: 1.0.0
  description: Асинхронные события системы умного дома

servers:
  production:
    url: kafka://kafka.smarthouse.com:9092
    protocol: kafka

channels:
  notifications:
    publish:
      operationId: publishNotification
      message:
        $ref: '#/components/messages/Notification'

    subscribe:
      operationId: subscribeToNotifications
      message:
        $ref: '#/components/messages/Notification'

  telemetry:
    publish:
      operationId: publishTelemetry
      message:
        $ref: '#/components/messages/TelemetryEvent'

    subscribe:
      operationId: subscribeToTelemetry
      message:
        $ref: '#/components/messages/TelemetryEvent'

  device_events:
    publish:
      operationId: publishDeviceEvent
      message:
        $ref: '#/components/messages/DeviceEvent'

    subscribe:
      operationId: subscribeToDeviceEvents
      message:
        $ref: '#/components/messages/DeviceEvent'

components:
  messages:
    Notification:
      name: Notification
      title: Уведомление пользователю
      summary: Событие для уведомления пользователя
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NotificationPayload'

    TelemetryEvent:
      name: TelemetryEvent
      title: Событие телеметрии
      summary: Обновление данных телеметрии
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TelemetryEventPayload'

    DeviceEvent:
      name: DeviceEvent
      title: Событие устройства
      summary: Изменение состояния устройства
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DeviceEventPayload'

  schemas:
    NotificationPayload:
      type: object
      required:
        - event_id
        - type
        - user_id
        - message
      properties:
        event_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [info, warning, alert, success]
        user_id:
          type: string
        title:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true

    TelemetryEventPayload:
      type: object
      required:
        - device_id
        - timestamp
        - metrics
      properties:
        device_id:
          type: string
        timestamp:
          type: string
          format: date-time
        metrics:
          type: object
          additionalProperties:
            type: number
        anomaly_score:
          type: number
          minimum: 0
          maximum: 1

    DeviceEventPayload:
      type: object
      required:
        - device_id
        - event_type
        - timestamp
      properties:
        device_id:
          type: string
        event_type:
          type: string
          enum: [status_change, command_received, command_completed, error]
        old_status:
          type: string
        new_status:
          type: string
        command:
          type: object
        timestamp:
          type: string
          format: date-time
        error:
          type: string